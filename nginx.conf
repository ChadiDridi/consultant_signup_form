server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # AuthController.RegisterConsultant accepts a license file up to 10 MB
    # ([RequestSizeLimit(10_485_760)]); nginx's default client_max_body_size is 1 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    location / {
        try_files $uri /index.html;
    }
}
